<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b18" />
    <title>LocalDrop 视频查看</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #eef2ff; background: #080b18; }
      main { width: min(720px, 100%); margin: 0 auto; padding: 20px 16px calc(28px + env(safe-area-inset-bottom)); }
      h1 { margin: 0; font-size: 20px; }
      p { color: #aab5cf; font-size: 13px; line-height: 1.6; }
      .video-shell { margin-top: 18px; overflow: hidden; border: 1px solid rgba(148, 163, 184, .2); border-radius: 16px; background: #000; }
      video { display: block; width: 100%; max-height: 75vh; background: #000; }
      .actions { display: flex; gap: 10px; margin-top: 16px; }
      a, button { min-height: 46px; flex: 1; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 13px; padding: 0 14px; color: #fff; background: linear-gradient(135deg, #6d5dfc, #2aa8df); font: inherit; font-weight: 700; text-decoration: none; }
      a.secondary { color: #d8def1; background: rgba(148, 163, 184, .12); }
      .error { padding: 24px 0; color: #ffc7ce; }
    </style>
  </head>
  <body>
    <main>
      <h1>LocalDrop 视频查看</h1>
      <p id="hint">视频默认暂停，点击播放按钮后才会开始播放。</p>
      <div class="video-shell">
        <video id="video" controls playsinline preload="metadata"></video>
      </div>
      <div class="actions">
        <button id="share-button" type="button">分享视频链接</button>
        <a class="secondary" href="./index.html">返回下载器</a>
      </div>
      <p id="error" class="error" hidden></p>
    </main>
    <script>
      const video = document.querySelector('#video');
      const errorMessage = document.querySelector('#error');
      const shareButton = document.querySelector('#share-button');
      const sourceValue = new URLSearchParams(window.location.search).get('src') || '';
      let sourceUrl = '';

      try {
        const parsedUrl = new URL(sourceValue);
        if (parsedUrl.protocol !== 'https:') throw new Error('只允许打开 HTTPS 视频地址。');
        sourceUrl = parsedUrl.href;
        video.autoplay = false;
        video.src = sourceUrl;
        video.addEventListener('loadedmetadata', () => video.pause(), { once: true });
      } catch (error) {
        video.hidden = true;
        shareButton.hidden = true;
        errorMessage.hidden = false;
        errorMessage.textContent = error instanceof Error ? error.message : '视频地址无效。';
      }

      shareButton.addEventListener('click', () => {
        if (!sourceUrl) return;
        if (!navigator.share) {
          window.location.href = sourceUrl;
          return;
        }
        navigator.share({ title: 'LocalDrop 视频', url: sourceUrl }).catch((error) => {
          if (error?.name !== 'AbortError') window.location.href = sourceUrl;
        });
      });
    </script>
  </body>
</html>
